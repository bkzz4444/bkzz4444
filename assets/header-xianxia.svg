<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280">
  <defs>
    <!-- Deep obsidian-ink sky gradient -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050508" />
      <stop offset="55%" stop-color="#0d080c" />
      <stop offset="100%" stop-color="#1a090d" />
    </linearGradient>

    <!-- Blood-crimson moon glow -->
    <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#991b1b" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#050508" stop-opacity="0" />
    </radialGradient>

    <!-- Crimson-gold moon disk -->
    <radialGradient id="moon-disk" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="32%" stop-color="#ef4444" />
      <stop offset="78%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>

    <!-- Brushed gold-to-ivory title gradient -->
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="48%" stop-color="#f3d285" />
      <stop offset="100%" stop-color="#c6933d" />
    </linearGradient>

    <!-- Mountain ink layers -->
    <linearGradient id="mtn-far" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1116" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#090609" />
    </linearGradient>
    <linearGradient id="mtn-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180b0f" />
      <stop offset="100%" stop-color="#060508" />
    </linearGradient>
    <linearGradient id="mtn-near" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c070a" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- Soft mist gradient -->
    <linearGradient id="mist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0" />
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#050508" stop-opacity="0.95" />
    </linearGradient>

    <!-- Gold hairline border gradient -->
    <linearGradient id="gold-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c6933d" stop-opacity="0" />
      <stop offset="20%" stop-color="#c6933d" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#fde68a" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#c6933d" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#c6933d" stop-opacity="0" />
    </linearGradient>

    <clipPath id="banner-clip">
      <rect x="0" y="0" width="1000" height="280" rx="14" />
    </clipPath>

    <style>
      .ember {
        animation: floatUp 6s ease-in-out infinite;
      }
      .ember-slow {
        animation: floatUp 9s ease-in-out infinite;
      }
      .moon-pulse {
        animation: pulseGlow 5s ease-in-out infinite;
        transform-origin: 500px 132px;
      }
      @keyframes floatUp {
        0%   { transform: translateY(18px); opacity: 0; }
        30%  { opacity: 0.85; }
        70%  { opacity: 0.6; }
        100% { transform: translateY(-28px); opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.78; transform: scale(1); }
        50%      { opacity: 1; transform: scale(1.04); }
      }
    </style>
  </defs>

  <g clip-path="url(#banner-clip)">
    <!-- Background Sky -->
    <rect width="1000" height="280" fill="url(#sky)" />

    <!-- Faint calligraphy ink watermark in background -->
    <text x="115" y="168" fill="#ef4444" fill-opacity="0.06" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="700">道</text>
    <text x="775" y="182" fill="#f3d285" fill-opacity="0.05" font-family="Georgia, 'Times New Roman', serif" font-size="140" font-weight="700">劍</text>

    <!-- Crimson Moon Halo & Disk -->
    <circle class="moon-pulse" cx="500" cy="132" r="150" fill="url(#moon-glow)" />
    <circle cx="500" cy="132" r="64" fill="url(#moon-disk)" opacity="0.9" />
    <!-- Subtle inner eclipse ring -->
    <circle cx="500" cy="132" r="68" fill="none" stroke="#fde68a" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="500" cy="132" r="82" fill="none" stroke="#ef4444" stroke-opacity="0.22" stroke-width="0.8" stroke-dasharray="4 6" />

    <!-- Layered Chinese Ink-Wash Mountain Silhouettes (山水) -->
    <!-- Far misty range -->
    <path d="M 0,225 Q 95,152 195,196 T 385,172 Q 460,150 540,186 T 755,158 Q 880,140 1000,192 L 1000,280 L 0,280 Z" fill="url(#mtn-far)" />
    <!-- Mid sharp peaks -->
    <path d="M 0,248 Q 72,188 150,218 Q 230,170 318,226 Q 410,198 500,234 Q 600,188 710,224 Q 825,168 920,212 L 1000,198 L 1000,280 L 0,280 Z" fill="url(#mtn-mid)" />
    <!-- Foreground dark ink ridge -->
    <path d="M 0,262 Q 120,226 260,254 Q 400,238 545,260 Q 705,232 865,256 L 1000,242 L 1000,280 L 0,280 Z" fill="url(#mtn-near)" />

    <!-- Flowing crimson mist veil -->
    <rect x="0" y="165" width="1000" height="115" fill="url(#mist)" />

    <!-- Traditional Chinese Geometric Corner Accents (回紋) -->
    <g stroke="#c6933d" stroke-opacity="0.55" stroke-width="1.2" fill="none">
      <!-- Top-left corner -->
      <path d="M 22,42 L 22,22 L 48,22 M 28,36 L 28,28 L 38,28" />
      <!-- Top-right corner -->
      <path d="M 978,42 L 978,22 L 952,22 M 972,36 L 972,28 L 962,28" />
      <!-- Bottom-left corner -->
      <path d="M 22,238 L 22,258 L 48,258 M 28,244 L 28,252 L 38,252" />
      <!-- Bottom-right corner -->
      <path d="M 978,238 L 978,258 L 952,258 M 972,244 L 972,252 L 962,252" />
    </g>

    <!-- Animated Floating Golden-Crimson Embers -->
    <g>
      <circle class="ember" cx="210" cy="195" r="1.8" fill="#fde68a" style="animation-delay:0s" />
      <circle class="ember-slow" cx="310" cy="145" r="1.4" fill="#ef4444" style="animation-delay:1.2s" />
      <circle class="ember" cx="390" cy="210" r="2.0" fill="#fbbf24" style="animation-delay:2.1s" />
      <circle class="ember-slow" cx="615" cy="195" r="1.7" fill="#fde68a" style="animation-delay:0.8s" />
      <circle class="ember" cx="695" cy="150" r="1.5" fill="#ef4444" style="animation-delay:3.0s" />
      <circle class="ember-slow" cx="790" cy="205" r="2.1" fill="#fbbf24" style="animation-delay:1.7s" />
      <circle class="ember" cx="465" cy="95" r="1.3" fill="#fffbeb" style="animation-delay:2.5s" />
      <circle class="ember-slow" cx="545" cy="88" r="1.4" fill="#fde68a" style="animation-delay:0.4s" />
    </g>

    <!-- Main Title Typography -->
    <text x="500" y="138" text-anchor="middle" fill="url(#gold-text)" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" letter-spacing="16">ALEXIOS</text>

    <!-- Ornamental Gold Hairline -->
    <line x1="270" y1="158" x2="730" y2="158" stroke="url(#gold-line)" stroke-width="1.2" />
    <polygon points="500,153 505,158 500,163 495,158" fill="#fde68a" />

    <!-- Chinese + English Subtitle -->
    <text x="500" y="186" text-anchor="middle" fill="#e5d5b5" fill-opacity="0.9" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" letter-spacing="5">一念通天 · FLUTTER · PYTHON · 3D WEBGL</text>

    <!-- Traditional Vermilion Cinnabar Seal Stamp (印章) -->
    <g transform="translate(888, 98)">
      <rect x="0" y="0" width="44" height="44" rx="4" fill="#b91c1c" fill-opacity="0.92" stroke="#fca5a5" stroke-opacity="0.45" stroke-width="1" />
      <rect x="3" y="3" width="38" height="38" rx="2" fill="none" stroke="#fef2f2" stroke-opacity="0.55" stroke-width="0.9" />
      <text x="22" y="20" text-anchor="middle" fill="#fff5f5" font-family="Georgia, serif" font-size="14" font-weight="700">無</text>
      <text x="22" y="36" text-anchor="middle" fill="#fff5f5" font-family="Georgia, serif" font-size="14" font-weight="700">極</text>
    </g>

    <!-- Outer subtle border -->
    <rect x="0.75" y="0.75" width="998.5" height="278.5" rx="13.5" fill="none" stroke="#c6933d" stroke-opacity="0.28" stroke-width="1.2" />
  </g>
</svg>
